name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, mne-chatbot]
    steps:
      - name: Deploy locally on self-hosted runner
        run: |
          set -e
          cd "$HOME/MNE_ChatBot"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          venv/bin/pip install -r requirements.txt
          cd client
          npm install --no-audit --no-fund
          npm run build
          cd ..
          sudo systemctl restart rag-chatbot
          systemctl is-active rag-chatbot
