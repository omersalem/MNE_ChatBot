<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enterprise RAG Assistant{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>RAG Assistant</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                    <span class="nav-icon">&#128172;</span> Chat
                </a>
                <a href="/admin" class="nav-link {% if request.path.startswith('/admin') %}active{% endif %}">
                    <span class="nav-icon">&#9881;</span> Admin
                </a>
            </nav>
            <div class="sidebar-footer">
                <p class="version">v1.0.0</p>
            </div>
        </aside>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
